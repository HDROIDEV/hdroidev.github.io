<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href='https://fonts.googleapis.com/css?family=Source Sans Pro' rel='stylesheet'>
    
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
}

body {
  position: relative;
  overflow: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: url("./img/Grid.png") repeat;
  background-size: 150px 150px;
  opacity: 0.4;
  animation: scroll 10s linear infinite;
}

body {
  text-align: center;
  color: #fff;
  font-family: Arial;
}

body > * {
  position: relative;
}

@keyframes scroll {
  from { background-position: 0 0; }
  to   { background-position: -150px -150px; }
}

h1 {
  font-size: 80px;
}
p {
  font-size: 30px;
}

#hoverTip {
  position: fixed;
  pointer-events: none;
  border: 5px solid #000;
  background: rgb(250, 225, 0, 0.5);
  color: #000;
  padding: 6px 12px;
  font-size: 18px;
  display: none;
  z-index: 100;
  transform: translate(15px, 15px);
}
</style>

</head>
<body>
    <p></p>
    <h1>HDROID's Workspace</h1>
    <p></p>
           <h2>Welcome to me websitio amigo</h2>
           <!-- might add sections like social media n shit.. -->
           <p>Projects:</p>
           <p2>This Website is still on Developement...</p2>


    <p></p>
<a href="https://discord.gg/Nr3pXmvA6" class="hoverLink" data-tip="this server is dead" style="position: absolute; top: 0px; left: 350px; z-index: 10;">
  <img src="https://cdn-icons-png.flaticon.com/512/5968/5968756.png" alt="Discord" width="100" height="100">
</a>
<a href="https://youtube.com/@HDROID" class="hoverLink" data-tip="visit my youtube channel" style="position: absolute; top: 0px; right: 350px; z-index: 10;">
  <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YouTube" width="100" height="100">
</a>

<div id="hoverTip"></div>

<script>
const tip = document.getElementById('hoverTip');
document.querySelectorAll('.hoverLink').forEach(link => {
  link.addEventListener('mouseenter', () => {
    tip.textContent = link.dataset.tip;
    tip.style.display = 'block';
  });
  link.addEventListener('mousemove', e => {
    tip.style.left = e.clientX + 'px';
    tip.style.top = e.clientY + 'px';
  });
  link.addEventListener('mouseleave', () => {
    tip.style.display = 'none';
  });
});
</script>

  </body>
</html>
