  content: "";
  position: fixed;
  inset: 0;
  background: url("./img/Grid.png") repeat;
  background-size: 150px 150px;
  opacity: 0.4;
  animation: scroll 10s linear infinite;
}

body {
  text-align: center;
  color: #fff;
  font-family: Arial;
}

body > * {
  position: relative;
}

@keyframes scroll {
  from { background-position: 0 0; }
  to   { background-position: -150px -150px; }
}

  font-size: 80px;
}

  font-size: 30px;
}

  position: fixed;
  pointer-events: none;

  padding: 6px 12px;
  font-size: 18px;
  display: none;
  z-index: 100;
  transform: translate(15px, 15px);
}
